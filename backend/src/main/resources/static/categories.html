<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categories</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body>
<div class="container-fluid"><div class="row"><aside id="adminSidebar" class="col-md-3 col-lg-2 admin-sidebar p-3"></aside>
<main class="col-md-9 col-lg-10 p-4"><div class="d-flex justify-content-between mb-3"><h3 class="fw-bold">Category Management</h3><button class="btn btn-dark" onclick="openCat()">+ Add Category</button></div>
<div id="alertBox" class="alert d-none"></div>
<div class="card shadow-sm"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Order</th><th>English Name</th><th>Telugu Name</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody id="catTable"></tbody></table></div>
</main></div></div>
<div class="modal fade" id="catModal" tabindex="-1"><div class="modal-dialog"><form id="catForm" class="modal-content">
<div class="modal-header"><h5 class="modal-title">Category</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><input type="hidden" id="catId">
<div class="mb-2"><label class="form-label">Name (English) *</label><input id="catName" class="form-control" required></div>
<div class="mb-2"><label class="form-label">Name (Telugu)</label><input id="catNameTe" class="form-control"></div>
<div class="mb-2"><label class="form-label">Description</label><input id="catDesc" class="form-control"></div>
<div class="row"><div class="col-6"><label class="form-label">Order</label><input id="catOrder" type="number" class="form-control" value="0"></div>
<div class="col-6 d-flex align-items-end"><div class="form-check"><input id="catActive" type="checkbox" class="form-check-input" checked><label class="form-check-label">Active</label></div></div></div></div>
<div class="modal-footer"><button type="submit" class="btn btn-dark">Save</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/api.js"></script><script>
renderAdminSidebar('categories.html'); loadBusinessIdentity();
const cm = new bootstrap.Modal(catModal); let cache = [];
async function load(){ const r = await apiFetch('/api/admin/categories'); if(!r||!r.ok) return; cache = await r.json();
    catTable.innerHTML = cache.map(c=>`<tr><td>${c.displayOrder}</td><td class="fw-semibold">${c.name}</td><td>${c.nameTe||''}</td><td><span class="badge ${c.isActive?'bg-success':'bg-secondary'}">${c.isActive?'Active':'Inactive'}</span></td><td class="text-end"><button class="btn btn-sm btn-outline-primary me-1" onclick="editC(${c.id})">Edit</button><button class="btn btn-sm btn-outline-danger" onclick="delC(${c.id})">Delete</button></td></tr>`).join('');
}
function openCat(){ catId.value=''; catForm.reset(); catActive.checked=true; cm.show(); }
function editC(id){ const c=cache.find(x=>x.id===id); catId.value=c.id; catName.value=c.name; catNameTe.value=c.nameTe||''; catDesc.value=c.description||''; catOrder.value=c.displayOrder; catActive.checked=c.isActive; cm.show(); }
catForm.addEventListener('submit', async e => { e.preventDefault(); const id=catId.value;
    const r = await apiFetch(id?`/api/admin/categories/${id}`:'/api/admin/categories',{method:id?'PUT':'POST',body:JSON.stringify({name:catName.value.trim(),nameTe:catNameTe.value.trim(),description:catDesc.value.trim(),displayOrder:Number(catOrder.value||0),isActive:catActive.checked})});
    if(r&&r.ok){ cm.hide(); load(); } else { const d=await r.json(); alertBox.className='alert alert-danger'; alertBox.textContent=d.error; alertBox.classList.remove('d-none'); }
});
async function delC(id){ if(!confirm('Delete?')) return; const r=await apiFetch(`/api/admin/categories/${id}`,{method:'DELETE'}); if(r&&r.ok) load(); else { const d=await r.json(); alert(d.error); } }
load();
</script></body></html>
