<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Booking</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="/index.html" data-biz-name>Tent House</a><a class="btn btn-outline-light btn-sm" href="/index.html">Home</a></div></nav>
<div class="container py-5" style="max-width:700px;"><div class="card shadow p-4">
<h3 class="fw-bold mb-1">Request an Event Booking</h3><p class="text-muted small mb-3">Submit your event details and we will confirm availability.</p>
<div id="enqMsg" class="alert d-none"></div>
<form id="enqForm" class="row g-3">
<div class="col-md-6"><label class="form-label">Your Name *</label><input id="eName" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Mobile Number *</label><input id="eMobile" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Event Name *</label><input id="eEvent" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Event Type</label><select id="eType" class="form-select"><option>WEDDING</option><option>RECEPTION</option><option>ENGAGEMENT</option><option>BIRTHDAY</option><option>RELIGIOUS</option><option>OTHER</option></select></div>
<div class="col-md-4"><label class="form-label">Start Date *</label><input id="eStart" type="date" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">End Date *</label><input id="eEnd" type="date" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">Guests</label><input id="eGuests" type="number" class="form-control"></div>
<div class="col-12"><label class="form-label">Event Address *</label><input id="eAddr" class="form-control" required></div>
<div class="col-12"><label class="form-label">Items Needed / Notes</label><textarea id="eNotes" rows="3" class="form-control"></textarea></div>
<div class="col-12"><button class="btn btn-dark w-100 fw-semibold" type="submit">Submit Booking Request</button></div>
</form></div></div>
<script src="/js/api.js"></script><script>
loadBusinessIdentity();
document.getElementById('enqForm').addEventListener('submit', async e => {
    e.preventDefault();
    const res = await fetch('/api/public/booking-request', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
        fullName:eName.value.trim(), mobileNumber:eMobile.value.trim(), eventName:eEvent.value.trim(), eventType:eType.value,
        startDate:eStart.value, endDate:eEnd.value, eventAddress:eAddr.value.trim(),
        guestCount:eGuests.value?Number(eGuests.value):null, specialInstructions:eNotes.value.trim()
    })});
    const d = await res.json();
    enqMsg.className = res.ok ? 'alert alert-success' : 'alert alert-danger';
    enqMsg.textContent = res.ok ? `${d.message} Ref: ${d.bookingNumber}` : (d.error || 'Error');
    enqMsg.classList.remove('d-none'); if(res.ok) enqForm.reset();
});
</script></body></html>
