<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light"><div class="card shadow p-4" style="max-width:400px;width:100%;">
<h4 class="fw-bold text-center mb-1" data-biz-name>Admin Login</h4><p class="text-muted text-center small mb-4">Sign in to manage your Tent House</p>
<div id="errorBox" class="alert alert-danger d-none py-2 small"></div>
<form id="loginForm"><div class="mb-3"><label class="form-label">Username</label><input id="username" class="form-control" required value="admin"></div>
<div class="mb-3"><label class="form-label">Password</label><input id="password" type="password" class="form-control" required placeholder="Admin@123"></div>
<button type="submit" class="btn btn-dark w-100 fw-semibold">Login</button></form>
<div class="text-center mt-3"><a href="/index.html" class="small text-decoration-none">Back to Public Website</a></div></div>
<script src="/js/api.js"></script><script>
loadBusinessIdentity();
loginForm.addEventListener('submit', async e => {
    e.preventDefault(); errorBox.classList.add('d-none');
    const res = await apiFetch('/api/auth/login', { method:'POST', body:JSON.stringify({ username:username.value.trim(), password:password.value })});
    if(res && res.ok) window.location.href='/dashboard.html';
    else { const d = res ? await res.json() : {}; errorBox.textContent = d.error || 'Login failed'; errorBox.classList.remove('d-none'); }
});
</script></body></html>
