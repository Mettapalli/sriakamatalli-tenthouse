<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoices & Payments</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body>
<div class="container-fluid"><div class="row"><aside id="adminSidebar" class="col-md-3 col-lg-2 admin-sidebar p-3"></aside>
<main class="col-md-9 col-lg-10 p-4"><div class="d-flex justify-content-between mb-3"><h3 class="fw-bold">Invoices &amp; Payments</h3><div class="d-flex gap-2"><select id="bkPick" class="form-select form-select-sm"></select><input id="taxP" type="number" value="0" class="form-control form-control-sm" style="width:80px"><button class="btn btn-dark btn-sm text-nowrap" onclick="genI()">+ Invoice</button></div></div>
<div class="card shadow-sm"><table class="table table-hover mb-0 small"><thead class="table-light"><tr><th>Invoice #</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody id="invTable"></tbody></table></div>
</main></div></div>
<div class="modal fade" id="payModal" tabindex="-1"><div class="modal-dialog"><form id="payForm" class="modal-content"><div class="modal-header"><h5 class="modal-title">Record Payment</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><input type="hidden" id="pInvId"><div class="mb-2"><label>Amount *</label><input id="pAmt" type="number" step="0.01" min="1" class="form-control" required></div><div class="mb-2"><label>Method</label><select id="pMeth" class="form-select"><option>CASH</option><option>UPI</option><option>BANK_TRANSFER</option><option>OTHER</option></select></div><div class="mb-2"><label>Ref #</label><input id="pRef" class="form-control"></div><div><label>Notes</label><input id="pNot" class="form-control"></div></div>
<div class="modal-footer"><button type="submit" class="btn btn-success">Save Payment</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/api.js"></script><script>
renderAdminSidebar('invoices.html'); loadBusinessIdentity(); const pm=new bootstrap.Modal(payModal);
(async()=>{ const bs=await(await apiFetch('/api/admin/bookings')).json(); bkPick.innerHTML=bs.map(x=>`<option value="${x.id}">${x.bookingNumber} - ${x.customer.fullName}</option>`).join(''); loadI(); })();
async function loadI(){ const l=await(await apiFetch('/api/admin/invoices')).json(); invTable.innerHTML=l.map(i=>`<tr><td class="fw-semibold">${i.invoiceNumber}</td><td>${i.customer.fullName}</td><td class="fw-bold">â‚¹${i.totalAmount}</td><td class="text-success">â‚¹${i.paidAmount}</td><td class="text-danger fw-bold">â‚¹${i.balanceAmount}</td><td><span class="badge bg-secondary">${i.paymentStatus}</span></td><td class="text-end"><a href="/api/admin/invoices/${i.id}/pdf" target="_blank" class="btn btn-sm btn-outline-danger">PDF</a> ${i.paymentStatus!=='PAID'?`<button class="btn btn-sm btn-success" onclick="openP(${i.id},${i.balanceAmount})">+ Pay</button>`:''}</td></tr>`).join(''); }
async function genI(){ if(!bkPick.value) return; await apiFetch(`/api/admin/invoices/from-booking/${bkPick.value}?taxPercentage=${taxP.value||0}`,{method:'POST'}); loadI(); }
function openP(id,bal){ pInvId.value=id; pAmt.value=bal; pm.show(); }
payForm.addEventListener('submit', async e => { e.preventDefault(); await apiFetch(`/api/admin/invoices/${pInvId.value}/payments`,{method:'POST',body:JSON.stringify({amount:Number(pAmt.value),paymentMethod:pMeth.value,referenceNumber:pRef.value,notes:pNot.value})}); pm.hide(); loadI(); });
</script></body></html>
