<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expenses</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body>
<div class="container-fluid"><div class="row"><aside id="adminSidebar" class="col-md-3 col-lg-2 admin-sidebar p-3"></aside>
<main class="col-md-9 col-lg-10 p-4"><h3 class="fw-bold mb-3">Business Expenses</h3>
<form id="expForm" class="card p-3 shadow-sm mb-4"><div class="row g-2 align-items-end">
<div class="col-md-2"><label class="small">Date</label><input id="eDate" type="date" class="form-control form-control-sm" required></div>
<div class="col-md-2"><label class="small">Category</label><select id="eCat" class="form-select form-select-sm"><option>TRANSPORTATION</option><option>LABOUR</option><option>REPAIRS</option><option>MAINTENANCE</option><option>ELECTRICITY</option><option>PURCHASES</option><option>FUEL</option><option>OTHER</option></select></div>
<div class="col-md-4"><label class="small">Description</label><input id="eDesc" class="form-control form-control-sm" required></div>
<div class="col-md-2"><label class="small">Amount (â‚¹)</label><input id="eAmt" type="number" step="0.01" min="1" class="form-control form-control-sm" required></div>
<div class="col-md-2"><button class="btn btn-dark btn-sm w-100" type="submit">+ Add</button></div></div></form>
<div class="card shadow-sm"><table class="table table-hover mb-0 small"><thead class="table-light"><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th class="text-end">Action</th></tr></thead><tbody id="expTable"></tbody></table></div>
</main></div></div><script src="/js/api.js"></script><script>
renderAdminSidebar('expenses.html'); loadBusinessIdentity(); eDate.value=new Date().toISOString().split('T')[0];
async function loadE(){ const l=await(await apiFetch('/api/admin/expenses')).json(); expTable.innerHTML=l.map(e=>`<tr><td>${e.expenseDate}</td><td>${e.category}</td><td>${e.description}</td><td class="text-danger fw-bold">â‚¹${e.amount}</td><td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="delE(${e.id})">Delete</button></td></tr>`).join(''); }
expForm.addEventListener('submit', async ev => { ev.preventDefault(); await apiFetch('/api/admin/expenses',{method:'POST',body:JSON.stringify({expenseDate:eDate.value,category:eCat.value,description:eDesc.value.trim(),amount:Number(eAmt.value)})}); eDesc.value=''; eAmt.value=''; loadE(); });
async function delE(id){ await apiFetch(`/api/admin/expenses/${id}`,{method:'DELETE'}); loadE(); }
loadE();
</script></body></html>
