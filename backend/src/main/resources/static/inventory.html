<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Ledger</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body>
<div class="container-fluid"><div class="row"><aside id="adminSidebar" class="col-md-3 col-lg-2 admin-sidebar p-3"></aside>
<main class="col-md-9 col-lg-10 p-4"><h3 class="fw-bold mb-3">Inventory Stock Adjustment &amp; Ledger</h3>
<form id="adjForm" class="card p-3 shadow-sm mb-4"><div class="row g-2 align-items-end">
<div class="col-md-4"><label class="form-label small">Item</label><select id="adjItem" class="form-select form-select-sm"></select></div>
<div class="col-md-2"><label class="form-label small">Action</label><select id="adjType" class="form-select form-select-sm"><option value="PURCHASED">Purchased (+)</option><option value="REPAIRED">Repaired</option><option value="DAMAGED">Damaged</option><option value="MISSING">Missing (-)</option></select></div>
<div class="col-md-2"><label class="form-label small">Qty</label><input id="adjQty" type="number" min="1" class="form-control form-control-sm" required></div>
<div class="col-md-2"><label class="form-label small">Remarks</label><input id="adjRem" class="form-control form-control-sm"></div>
<div class="col-md-2"><button class="btn btn-dark btn-sm w-100" type="submit">Update Stock</button></div></div></form>
<div class="card shadow-sm"><table class="table table-hover mb-0 small"><thead class="table-light"><tr><th>Date</th><th>Item</th><th>Type</th><th>Qty</th><th>Remarks</th></tr></thead><tbody id="txTable"></tbody></table></div>
</main></div></div><script src="/js/api.js"></script><script>
renderAdminSidebar('inventory.html'); loadBusinessIdentity();
async function loadData(){
    const items = await(await apiFetch('/api/admin/items')).json();
    adjItem.innerHTML = items.map(i=>`<option value="${i.id}">${i.itemCode} - ${i.name} (Avail:${i.availableQuantity}, Dmg:${i.damagedQuantity})</option>`).join('');
    const txs = await(await apiFetch('/api/admin/inventory/transactions')).json();
    txTable.innerHTML = txs.map(t=>`<tr><td>${t.transactionDate?t.transactionDate.replace('T',' ').substring(0,16):''}</td><td>${t.itemCode} - ${t.itemName}</td><td><span class="badge bg-secondary">${t.transactionType}</span></td><td class="fw-bold">${t.quantity}</td><td>${t.remarks||''}</td></tr>`).join('');
}
adjForm.addEventListener('submit', async e => { e.preventDefault(); const r=await apiFetch('/api/admin/inventory/adjust',{method:'POST',body:JSON.stringify({itemId:Number(adjItem.value),type:adjType.value,quantity:Number(adjQty.value),remarks:adjRem.value.trim()})}); if(r&&r.ok){ adjQty.value=''; adjRem.value=''; loadData(); } });
loadData();
</script></body></html>
