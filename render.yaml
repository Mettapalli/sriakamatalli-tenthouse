services:
  - type: web
    name: sriakamatalli-tenthouse
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"