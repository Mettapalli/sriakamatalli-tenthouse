<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports & P&L</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body>
<div class="container-fluid"><div class="row"><aside id="adminSidebar" class="col-md-3 col-lg-2 admin-sidebar p-3"></aside>
<main class="col-md-9 col-lg-10 p-4"><div class="d-flex justify-content-between mb-3"><h3 class="fw-bold">Reports &amp; Profit / Loss</h3><div class="d-flex gap-2"><input id="rS" type="date" class="form-control form-control-sm"><input id="rE" type="date" class="form-control form-control-sm"><button class="btn btn-dark btn-sm" onclick="loadR()">Filter</button><button class="btn btn-outline-secondary btn-sm" onclick="window.print()">Print</button></div></div>
<div class="row g-2 mb-4">
<div class="col-md-2"><div class="card p-2"><small>Bookings</small><h5 id="rC">0</h5></div></div>
<div class="col-md-2"><div class="card p-2"><small>Billed</small><h6 id="rB">â‚¹0</h6></div></div>
<div class="col-md-2"><div class="card p-2"><small>Collected</small><h6 class="text-success" id="rCol">â‚¹0</h6></div></div>
<div class="col-md-2"><div class="card p-2"><small>Expenses</small><h6 class="text-danger" id="rEx">â‚¹0</h6></div></div>
<div class="col-md-2"><div class="card p-2"><small>Est. Profit</small><h6 class="text-primary" id="rP">â‚¹0</h6></div></div>
<div class="col-md-2"><div class="card p-2"><small>Pending</small><h6 class="text-warning" id="rOut">â‚¹0</h6></div></div></div>
<div class="row g-3"><div class="col-lg-6"><div class="card p-3"><h6>Outstanding Balances</h6><table class="table table-sm small"><tbody id="outB"></tbody></table></div></div>
<div class="col-lg-6"><div class="card p-3"><h6>Top Rented Items</h6><table class="table table-sm small"><tbody id="topB"></tbody></table></div></div></div>
</main></div></div><script src="/js/api.js"></script><script>
renderAdminSidebar('reports.html'); loadBusinessIdentity(); const n=new Date(); rS.value=new Date(n.getFullYear(),n.getMonth(),1).toISOString().split('T')[0]; rE.value=n.toISOString().split('T')[0];
async function loadR(){
    const s=await(await apiFetch(`/api/admin/reports/financial-summary?startDate=${rS.value}&endDate=${rE.value}`)).json();
    rC.textContent=s.bookingsCount; rB.textContent='â‚¹'+s.billedRevenue; rCol.textContent='â‚¹'+s.collectedPayments; rEx.textContent='â‚¹'+s.totalExpenses; rP.textContent='â‚¹'+s.estimatedProfit; rOut.textContent='â‚¹'+s.outstandingBalances;
    const o=await(await apiFetch('/api/admin/reports/outstanding-customers')).json();
    outB.innerHTML=o.map(x=>`<tr><td>${x.customerName} (${x.mobileNumber})</td><td>${x.bookingNumber}</td><td class="text-danger fw-bold">â‚¹${x.balanceAmount}</td></tr>`).join('')||'<tr><td>No pending balances</td></tr>';
    const t=await(await apiFetch('/api/admin/reports/top-rented-items')).json();
    topB.innerHTML=t.map(x=>`<tr><td>${x.itemCode}</td><td>${x.itemName}</td><td>Qty: ${x.totalRentedQty}</td><td class="fw-bold">â‚¹${x.totalRevenue}</td></tr>`).join('')||'<tr><td>No rentals yet</td></tr>';
}
loadR();
</script></body></html>
