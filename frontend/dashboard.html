<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body>
<div class="container-fluid"><div class="row"><aside id="adminSidebar" class="col-md-3 col-lg-2 admin-sidebar p-3"></aside>
<main class="col-md-9 col-lg-10 p-4">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="fw-bold mb-0">Admin Dashboard</h3><small class="text-muted">Logged in as: <span id="adminName">Admin</span></small></div><a href="/index.html" class="btn btn-outline-dark btn-sm">Public Website</a></div>
<div class="row g-3">
<div class="col-sm-6 col-xl-3"><div class="card kpi-card p-3 shadow-sm"><small class="text-muted">Total Items</small><h3 class="fw-bold mb-0" id="kpiItems">-</h3></div></div>
<div class="col-sm-6 col-xl-3"><div class="card kpi-card p-3 shadow-sm"><small class="text-muted">Categories</small><h3 class="fw-bold mb-0" id="kpiCats">-</h3></div></div>
<div class="col-sm-6 col-xl-3"><div class="card kpi-card p-3 shadow-sm"><small class="text-muted">Customers</small><h3 class="fw-bold mb-0" id="kpiCustomers">-</h3></div></div>
<div class="col-sm-6 col-xl-3"><div class="card kpi-card p-3 shadow-sm"><small class="text-muted">Bookings</small><h3 class="fw-bold mb-0" id="kpiBookings">-</h3></div></div>
<div class="col-sm-6 col-xl-3"><div class="card kpi-card p-3 shadow-sm"><small class="text-muted">Today's Events</small><h3 class="fw-bold mb-0" id="kpiToday">-</h3></div></div>
<div class="col-sm-6 col-xl-3"><div class="card kpi-card p-3 shadow-sm"><small class="text-muted">Upcoming Events</small><h3 class="fw-bold mb-0" id="kpiUpcoming">-</h3></div></div>
<div class="col-sm-6 col-xl-3"><div class="card kpi-card p-3 shadow-sm"><small class="text-muted">Monthly Income</small><h3 class="fw-bold text-success mb-0" id="kpiIncome">-</h3></div></div>
<div class="col-sm-6 col-xl-3"><div class="card kpi-card p-3 shadow-sm"><small class="text-muted">Pending Payments</small><h3 class="fw-bold text-danger mb-0" id="kpiPending">-</h3></div></div>
</div></main></div></div>
<script src="/js/api.js"></script><script>
renderAdminSidebar('dashboard.html');
(async () => {
    const auth = await (await apiFetch('/api/auth/me')).json();
    if(!auth.authenticated){ window.location.href='/login.html'; return; }
    adminName.textContent = auth.fullName; loadBusinessIdentity();
    const res = await apiFetch('/api/admin/dashboard/summary'); if(!res||!res.ok) return;
    const d = await res.json();
    kpiItems.textContent=d.totalItems; kpiCats.textContent=d.totalCategories; kpiCustomers.textContent=d.totalCustomers; kpiBookings.textContent=d.totalBookings;
    kpiToday.textContent=d.todaysEvents; kpiUpcoming.textContent=d.upcomingEvents;
    kpiIncome.textContent='â‚¹'+Number(d.monthlyIncome).toFixed(2); kpiPending.textContent='â‚¹'+Number(d.pendingPayments).toFixed(2);
})();
</script></body></html>
