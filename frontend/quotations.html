<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotations</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body>
<div class="container-fluid"><div class="row"><aside id="adminSidebar" class="col-md-3 col-lg-2 admin-sidebar p-3"></aside>
<main class="col-md-9 col-lg-10 p-4"><div class="d-flex justify-content-between mb-3"><h3 class="fw-bold">Quotations</h3><div class="d-flex gap-2"><select id="bkPick" class="form-select form-select-sm"></select><button class="btn btn-dark btn-sm text-nowrap" onclick="genQ()">+ Generate</button></div></div>
<div class="card shadow-sm"><table class="table table-hover mb-0 small"><thead class="table-light"><tr><th>Quotation #</th><th>Customer</th><th>Date</th><th>Total</th><th class="text-end">Actions</th></tr></thead><tbody id="qtTable"></tbody></table></div>
</main></div></div><script src="/js/api.js"></script><script>
renderAdminSidebar('quotations.html'); let biz='SRIAKAMATALLI TENT HOUSE';
(async()=>{ const b=await loadBusinessIdentity(); if(b) biz=b.businessName; const bs=await(await apiFetch('/api/admin/bookings')).json(); bkPick.innerHTML=bs.map(x=>`<option value="${x.id}">${x.bookingNumber} - ${x.customer.fullName}</option>`).join(''); loadQ(); })();
async function loadQ(){ const l=await(await apiFetch('/api/admin/quotations')).json(); qtTable.innerHTML=l.map(q=>{ const p=(q.customer.whatsappNumber||q.customer.mobileNumber).replace(/\D/g,''); const wa=p.length===10?'91'+p:p; return `<tr><td class="fw-semibold">${q.quotationNumber}</td><td>${q.customer.fullName}</td><td>${q.quotationDate}</td><td class="fw-bold">â‚¹${q.grandTotal}</td><td class="text-end"><a href="/api/admin/quotations/${q.id}/pdf" target="_blank" class="btn btn-sm btn-outline-danger">PDF</a> <a href="https://wa.me/${wa}?text=${encodeURIComponent(`Namaste ${q.customer.fullName}, Quotation ${q.quotationNumber} from ${biz}: Rs. ${q.grandTotal}`)}" target="_blank" class="btn btn-sm btn-success">WhatsApp</a></td></tr>`; }).join(''); }
async function genQ(){ if(!bkPick.value) return; await apiFetch(`/api/admin/quotations/from-booking/${bkPick.value}`,{method:'POST'}); loadQ(); }
</script></body></html>
